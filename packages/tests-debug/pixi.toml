[package]
name = { workspace = true }
version = { workspace = true }
build = {
  backend.name = "pixi-build-cmake",
  config.extra-args = [
    "-DBUILD_TESTS=ON",
    "-DCMAKE_BUILD_TYPE=Debug",
  ],
  flags = ["tests", "debug"],
  source.path = "../..",
  # RECIPE_DIR references the current working directory,
  # enabling ccache specific to this build variant.
  target.unix.config.env = {
    CCACHE_DIR = "$RECIPE_DIR/.ccache",
    CCACHE_BASEDIR = "$RECIPE_DIR",
  },
  target.win.config.env = {
    CCACHE_DIR = "%RECIPE_DIR%\\.ccache",
    CCACHE_BASEDIR = "%RECIPE_DIR%.",
  },
}
build-dependencies = {
  xsref = {
    git = "https://github.com/scipy/xsref",
    rev = "47cb6b3d6d80bc1a74e884642b254f7afd9406ab",
  },
  ccache = "*",
}
host-dependencies = {
  catch2 = "*",
  libarrow-all = ">=22,<23", # Arrow 23 requires C++20; tests must use C++17.
}
run-dependencies = {
  cmake = "*",
}
